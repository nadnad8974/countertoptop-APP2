<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countertop Template - Standalone</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
    header { display:flex; justify-content:space-between; align-items:center; padding:12px; background:#111827; position:sticky; top:0; }
    main { padding: 12px; }
    button { background:#1d4ed8; color:#fff; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; }
    button.active { background:#16a34a; }
    button:disabled { opacity:.5; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .grid { display:grid; grid-template-columns:320px 1fr; gap:12px; }
    .panel { background:#1e293b; padding:10px; border-radius:10px; }
    input, textarea, select { width:100%; margin-top:4px; margin-bottom:8px; background:#0b1220; color:#e2e8f0; border:1px solid #334155; border-radius:8px; padding:8px; box-sizing:border-box; }
    .job { background:#1e293b; border-radius:10px; padding:10px; margin-bottom:8px; }
    .canvas-wrap { background:#1e293b; border-radius:10px; padding:8px; }
    canvas { width:100%; height:560px; background:#f8fafc; border-radius:8px; touch-action:none; }
    .points { max-height:220px; overflow:auto; }
    .point-row { display:grid; grid-template-columns:40px 1fr 1fr auto; gap:6px; margin-bottom:6px; }
    @media (max-width: 900px){ .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <strong>Stone Countertop Template Standalone</strong>
    <div class="row">
      <button id="navJobs">Jobs</button>
      <button id="navSettings">Settings</button>
    </div>
  </header>
  <main id="app"></main>
  <script src="./app.js"></script>
</body>
</html>
