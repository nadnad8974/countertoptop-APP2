name: Build Ramsiers Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'RamsiersGraniteApp-debug.apk'
      - 'build-error.log'
      - 'full-build.log'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply wizard and MSI patch
        run: python3 scripts/apply_wizard_patch.py

      - name: Commit patched source
        if: success() && github.event_name == 'push'
        run: |
          if git diff --quiet -- app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/ramsiers/graniteapp/MainActivity.java; then
            echo "Wizard source already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/ramsiers/graniteapp/MainActivity.java
            git commit -m "Add wizard quote flow and MSI slab links"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: android_build
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee full-build.log
          result=${PIPESTATUS[0]}
          grep -E -B 20 -A 40 "Duplicate class|defined multiple times|What went wrong|Execution failed| error:| FAILED" full-build.log > build-error.log || true
          exit $result

      - name: Save compiler logs
        if: failure() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-error.log full-build.log
          git commit -m "Save full Android build error log [skip ci]" || exit 0
          git push

      - name: Copy APK to repository root
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk RamsiersGraniteApp-debug.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RamsiersGraniteApp-debug
          path: RamsiersGraniteApp-debug.apk
          retention-days: 30

      - name: Commit latest APK for phone download
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RamsiersGraniteApp-debug.apk
          git commit -m "Build Ramsiers test APK [skip ci]" || exit 0
          git push
