name: Build Ramsiers Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'RamsiersGraniteApp-debug.apk'
      - 'build-error.log'
      - 'full-build.log'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate wrapper and cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and build debug APK
        run: ./gradlew clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Test payment service
        working-directory: payment-service
        run: |
          npm ci
          npm test
          npm audit --omit=dev

      - name: Verify APK identity and checksum
        run: |
          signature_report=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$signature_report"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$signature_report"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$signature_report"
          badging_report=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$badging_report"
          grep -Fq "package: name='com.ramsiers.graniteapp' versionCode='60' versionName='1.60-test'" <<< "$badging_report"
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RamsiersGraniteApp-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 30
