name: Apply page 19 actions and build
on:
  push:
    branches: [agent/ramsiers-app-current-edge-detail]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply page 19 source update
        env:
          PATCH_B64: 
        run: |
          mkdir -p .github/scripts
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > .github/scripts/apply_page19_actions.py
          python .github/scripts/apply_page19_actions.py
          rm -f .github/scripts/apply_page19_actions.py
      - name: Test, lint, and build debug APK
        run: ./gradlew clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Test payment service
        working-directory: payment-service
        run: |
          npm ci
          npm test
          npm audit --omit=dev
      - name: Verify APK identity and checksum
        run: |
          signature_report=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$signature_report"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$signature_report"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$signature_report"
          badging_report=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$badging_report"
          grep -Fq "package: name='com.ramsiers.graniteapp' versionCode='85' versionName='1.85-test'" <<< "$badging_report"
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: RamsiersGraniteApp-v1.85-test
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 30
      - name: Commit tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/ramsiers/graniteapp/MainActivity.java app/src/main/java/com/ramsiers/graniteapp/Page19Actions.java app/src/test/java/com/ramsiers/graniteapp/Page19ActionsTest.java
          git commit -m "Reorder page 19 actions and chain save popups [skip ci]"
          git push origin HEAD:"${{ github.ref_name }}"
