name: Build Ramsiers Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'RamsiersGraniteApp-debug.apk'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy APK to repository root
        run: cp app/build/outputs/apk/debug/app-debug.apk RamsiersGraniteApp-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RamsiersGraniteApp-debug
          path: RamsiersGraniteApp-debug.apk
          retention-days: 30

      - name: Commit latest APK for phone download
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RamsiersGraniteApp-debug.apk
          git commit -m "Build Ramsiers test APK [skip ci]" || exit 0
          git push
