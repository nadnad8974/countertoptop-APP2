name: Apply Ramsiers Wizard UI

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_wizard.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Apply one-question wizard update
        run: python .github/scripts/apply_wizard.py
      - name: Commit updated Android app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ramsiers/graniteapp/MainActivity.java app/src/main/AndroidManifest.xml app/build.gradle
          git commit -m "Add one-question wizard and keyboard-safe navigation" || exit 0
          git push
